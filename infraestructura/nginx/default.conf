# =============================================================
# Nginx — proxy inverso para Odoo 18
#
# Solo el sitio de Odoo. Los bloques de MinIO viven en
# minio.conf.disabled: renómbralo a minio.conf SOLO cuando
# s3.<dominio> y minio.<dominio> tengan registro A y certificado.
#
# nginx aborta el arranque si un ssl_certificate no existe, así que
# un bloque de un dominio sin cert tumba TODO el proxy, no solo ese sitio.
# =============================================================

# Necesario para WebSockets: "upgrade" solo si el cliente lo pide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream odoo {
    server odoo:8069;
}

# Puerto gevent de Odoo 18 — requiere workers > 0 en odoo.conf
upstream odoo_websocket {
    server odoo:8072;
}

# Compresión (los assets de Odoo son JS/CSS grandes)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

# Ajustes SSL comunes
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# ─────────────────────────────────────────────
# Bloque por defecto: corta peticiones a hosts no reconocidos
# (escaneos por IP). 444 = cierra sin responder.
# ─────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# ─────────────────────────────────────────────
# ODOO  ->  cursos.robotsconsultant.net
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name cursos.robotsconsultant.net;

    # ACME challenge para Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cursos.robotsconsultant.net;

    ssl_certificate     /etc/letsencrypt/live/cursos.robotsconsultant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cursos.robotsconsultant.net/privkey.pem;

    # HSTS: fuerza https en el navegador durante 1 año.
    # OJO: una vez servido, el navegador lo recuerda aunque quites
    # la cabecera. No lo actives hasta confirmar que el cert es válido.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida (ajusta según necesites)
    client_max_body_size 200m;

    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    # ---------------------------------------------------------
    # ESTO es lo que faltaba: sin estas cabeceras nginx envía
    # "Host: odoo:8069" y Odoo, pese a proxy_mode = True, se
    # autodetecta con el hostname del contenedor y escribe
    # web.base.url = http://odoo_app:8069
    # ---------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Defensa en profundidad: list_db = False ya lo oculta,
    # esto lo bloquea también a nivel de proxy.
    location /web/database/ {
        return 404;
    }

    # WebSocket de Odoo 18 (chat, notificaciones en vivo).
    # En Odoo <= 15 esto era /longpolling/ — ya no existe.
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Assets versionados por Odoo: cachean bien y de forma segura.
    # Solo 'expires' — un add_header aquí anularía por herencia los
    # add_header del bloque server (HSTS, nosniff...) en estas respuestas.
    location ~* /web/(static|assets)/ {
        proxy_pass http://odoo;
        proxy_http_version 1.1;
        proxy_buffering on;
        expires 864000;
    }

    location / {
        proxy_pass http://odoo;
        proxy_http_version 1.1;
        proxy_redirect off;
    }
}
