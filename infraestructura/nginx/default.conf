# ─────────────────────────────────────────────
# ODOO  ->  cursos.robotsconsultant.net
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name cursos.robotsconsultant.net;

    # ACME challenge para Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cursos.robotsconsultant.net;

    ssl_certificate     /etc/letsencrypt/live/cursos.robotsconsultant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cursos.robotsconsultant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Tamaño máximo de subida (ajusta según necesites)
    client_max_body_size 200m;

    # Longpolling de Odoo (chat, notificaciones)
    location /longpolling/ {
        proxy_pass http://odoo:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://odoo:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
    }
}

# ─────────────────────────────────────────────
# MINIO API S3  ->  s3.robotsconsultant.net
# Odoo usa este endpoint para leer/escribir objetos
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name s3.robotsconsultant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name s3.robotsconsultant.net;

    ssl_certificate     /etc/letsencrypt/live/s3.robotsconsultant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.robotsconsultant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Videos pueden ser grandes — sin límite aquí
    client_max_body_size 0;

    # Necesario para que MinIO gestione chunked uploads de S3
    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        chunked_transfer_encoding on;
    }
}

# ─────────────────────────────────────────────
# MINIO CONSOLE  ->  minio.robotsconsultant.net
# Panel web de administración de MinIO
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name minio.robotsconsultant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
