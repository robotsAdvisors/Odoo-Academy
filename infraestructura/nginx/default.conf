    ssl_certificate_key /etc/letsencrypt/live/minio.robotsconsultant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_pass http://minio:9001;
