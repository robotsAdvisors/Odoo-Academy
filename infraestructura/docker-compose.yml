services:
  db:
    image: postgres:16
    container_name: odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - odoo_net

  odoo:
    image: odoo:18.0
    container_name: odoo_app
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./custom-addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    expose:
      - "8069"
      - "8072"
    networks:
      - odoo_net

  minio:
    image: minio/minio:latest
    container_name: odoo_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123  # Cambia esto antes de desplegar
      MINIO_BROWSER_REDIRECT_URL: https://minio.tudominio.com  # Ajusta al dominio real
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    expose:
      - "9000"  # API S3
      - "9001"  # Consola web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - odoo_net

  nginx:
    image: nginx:alpine
    container_name: odoo_nginx
    restart: unless-stopped
    depends_on:
      - odoo
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - odoo_net

  certbot:
    image: certbot/certbot:latest
    container_name: odoo_certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # No se ejecuta como daemon — se lanza con: docker compose run --rm certbot <comando>
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'

volumes:
  odoo-data:
  minio-data:
  certbot-conf:
  certbot-www:

networks:
  odoo_net:
    driver: bridge